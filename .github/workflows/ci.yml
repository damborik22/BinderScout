name: CI

# EVERYTHING HERE IS PINNED ON PURPOSE.
#
# Twice now a floating dependency has reddened CI or broken a tool while this
# repo's own code sat unchanged:
#   * `pip install pyrosetta` (upstream BindCraft) picked up the 2026.29
#     quarterly, which changed InterfaceAnalyzerMover.set_interface() from
#     taking a str to requiring a DockingPartners. Fresh installs produced
#     ZERO designs. (BUG-14)
#   * `pip install ruff` picked up 0.17.x, which added RUF071, which flagged
#     two call sites nobody had touched.
#
# A pin that drifts silently is the bug; a pin that fails loudly on bump is
# the fix. Every version below is one we ran green on this repo -- so when you
# bump one, bump it deliberately, run the job, and land the fixes in the same
# commit as the bump.
#
# Runner images are pinned too: `ubuntu-latest` is a moving alias (it has
# already moved 20.04 -> 22.04 -> 24.04), and a runner migration changes the
# preinstalled toolchain under you.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to the commit behind the tag, not the tag: `v4` is a
      # mutable ref that the publisher re-points at each release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck
        # Not `apt-get install shellcheck`: apt gives whatever the runner image
        # happens to carry, which is both unpinnable (a version= pin goes
        # unsatisfiable the next time the image rebuilds) and a silent upgrade
        # path for new warnings. The official static binary can be pinned, and
        # the checksum makes the download tamper-evident.
        # 0.11.0 is the version the 11 discovered scripts were verified clean on.
        env:
          SC_VERSION: "0.11.0"
          SC_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          url="https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o shellcheck.tar.xz "$url"
          echo "${SC_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 "shellcheck-v${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Run shellcheck
        # Discovered, not hand-listed. The explicit list had drifted to 12 of the
        # 20 eligible scripts: tools/preflight.sh and tools/gpu_mem_guard.sh were
        # never linted -- despite evaluate.sh refusing to run without the latter --
        # and the whole GB10 failsafe landed unlinted. A list edited by hand is how
        # that happens, so derive it instead.
        #
        # Two exclusions, both real:
        #   docs/data/**   archived benchmark captures; run fragments that do not
        #                  parse standalone (SC1072/SC1073).
        #   *.sh.template  carry the {placeholder} braces the configurator
        #                  substitutes, which shellcheck reads as bad parameter
        #                  expansion (SC1083).
        # tools/gpurun is bash without a .sh suffix, so it is named explicitly --
        # guarded, since the 1.0.x line does not carry it.
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' | grep -v '^docs/data/')
          [ -f tools/gpurun ] && scripts+=(tools/gpurun)
          printf 'linting %d scripts\n' "${#scripts[@]}"
          shellcheck --shell=bash --severity=warning "${scripts[@]}"

  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install ruff
        # Pinned deliberately. Unpinned, a new ruff release adds a rule and CI
        # goes red on code nobody touched — RUF071 did exactly that. Bump this
        # on purpose, with the fixes in the same commit.
        run: pip install ruff==0.17.3
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install test deps
        # This list must mirror Evaluator/pyproject.toml [project.dependencies] —
        # CI installs the deps directly rather than the package, so a new runtime
        # import that is not added here fails collection, not just one test.
        # matplotlib is required because tests indirectly import
        # binder_comparison.cli.__init__ → cli.report → visualization.report
        # → visualization.plots → matplotlib.
        # requests likewise: refolding/target_msa.py imports it at module level.
        #
        # Pinned to the set verified green here on CPython 3.10.20
        # (627 passed, 6 skipped). pytest 9 in particular is a fresh major that
        # an unpinned install would have pulled in unannounced.
        run: |
          pip install \
            pytest==9.1.1 \
            pyyaml==6.0.3 \
            pandas==2.3.3 \
            numpy==2.2.6 \
            matplotlib==3.10.9 \
            requests==2.34.2
      - name: Run unit tests
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build base image
        # Base image tag is pinned in Dockerfile.test
        # (nvidia/cuda:12.4.1-devel-ubuntu22.04).
        run: docker build -f Dockerfile.test --target base -t bindmaster-test-base .
