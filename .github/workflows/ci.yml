name: CI

on:
  # Release branches are where the work happens -- master is frozen and is not
  # committed to directly -- so limiting CI to master meant none of it ran
  # anywhere. v1.1.x developed and shipped 1.1.1 without a single CI run, and
  # v2.0.x would have done the same, including the guards that exist precisely
  # to be enforced automatically (the benchmark-label leak check, and the
  # golden-pool ranking regression test 2.0 adds). 'v*.x' picks up the current
  # and future release lines without another edit here.
  push:
    branches: [master, 'v*.x']
  pull_request:
    branches: [master, 'v*.x']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        # Discovered, not hand-listed. The explicit list had drifted to 12 of the
        # 20 eligible scripts: tools/preflight.sh and tools/gpu_mem_guard.sh were
        # never linted -- despite evaluate.sh refusing to run without the latter --
        # and the whole GB10 failsafe landed unlinted. A list edited by hand is how
        # that happens, so derive it instead.
        #
        # Two exclusions, both real:
        #   docs/data/**   archived benchmark captures; run fragments that do not
        #                  parse standalone (SC1072/SC1073).
        #   *.sh.template  carry the {placeholder} braces the configurator
        #                  substitutes, which shellcheck reads as bad parameter
        #                  expansion (SC1083).
        # tools/gpurun is bash without a .sh suffix, so it is named explicitly --
        # guarded, since the 1.0.x line does not carry it.
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' | grep -v '^docs/data/')
          [ -f tools/gpurun ] && scripts+=(tools/gpurun)
          printf 'linting %d scripts\n' "${#scripts[@]}"
          shellcheck --shell=bash --severity=warning "${scripts[@]}"

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test deps
        # This list must mirror Evaluator/pyproject.toml [project.dependencies] —
        # CI installs the deps directly rather than the package, so a new runtime
        # import that is not added here fails collection, not just one test.
        # matplotlib is required because tests indirectly import
        # binder_comparison.cli.__init__ → cli.report → visualization.report
        # → visualization.plots → matplotlib.
        # requests likewise: refolding/target_msa.py imports it at module level.
        run: pip install pytest pyyaml pandas numpy matplotlib requests
      - name: Run unit tests
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build base image
        run: docker build -f Dockerfile.test --target base -t binderscout-test-base .
