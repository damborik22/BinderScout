name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          shellcheck --shell=bash --severity=warning \
            install/install.sh \
            install/install_aarch.sh \
            Evaluator/evaluate.sh \
            Evaluator/install.sh \
            Evaluator/run.sh \
            tools/fleet.sh \
            tools/fleet-check/check_launch.sh \
            tools/fleet-check/check_poll_fetch.sh \
            tools/fleet-check/check_probe.sh \
            tools/fleet-check/check_status.sh \
            docker-entrypoint.sh \
            test_env.sh

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test deps
        # matplotlib is required because tests indirectly import
        # binder_comparison.cli.__init__ → cli.report → visualization.report
        # → visualization.plots → matplotlib. (Declared in Evaluator/pyproject.toml.)
        run: pip install pytest pyyaml pandas numpy matplotlib
      - name: Run unit tests
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build base image
        run: docker build -f Dockerfile.test --target base -t bindmaster-test-base .
