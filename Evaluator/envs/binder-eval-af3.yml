name: binder-eval-af3
# AlphaFold 3 v3.0.2 refolding step.
#
# Used for: binder-compare refold-af3
# Platform: any host with >=100 GB GPU memory — H200 (x86_64), GH200, DGX Spark
#           (aarch64). Full AF3 inference does not fit on consumer 24 GB GPUs.
#
# AF3 model weights must be downloaded separately (gated by Google DeepMind):
#   1. Request access at https://github.com/google-deepmind/alphafold3
#   2. Place the model parameters at ~/.alphafold3/models/ (or set AF3_MODEL_DIR).
#
# AF3 is NOT a real PyPI package (the "alphafold3" PyPI name is an unrelated stub) —
# it is installed from the official repo (source build). The BindMaster installer
# (`bindmaster install --tool af3`) does this. If installing manually:
#   conda env create -f binder-eval-af3.yml
#   git clone https://github.com/google-deepmind/alphafold3 <repo_root>/alphafold3
#   conda run -n binder-eval-af3 pip install <repo_root>/alphafold3 gemmi   # jax 0.9.1 + C++ build
#   conda run -n binder-eval-af3 build_data                                  # CCD pickle (required)
#   conda run -n binder-eval-af3 pip install -e <repo_root>/Evaluator/[report]
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy>=1.24
  # AF3's `pip install <repo>` compiles native C++ — provide the toolchain so a
  # standalone install (Part H, no system build-essential) can build it. Resolves
  # on both linux-64 and linux-aarch64.
  - c-compiler
  - cxx-compiler
  - cmake
  - make
