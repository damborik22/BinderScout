# DGX Spark (GB10) unified-memory tuning.
#
# Scope note: only two VM knobs are set here. Everything else that gets suggested for this
# problem (swappiness, watermark_boost_factor=0, overcommit_memory=2, MGLRU min_ttl_ms,
# vfs_cache_pressure, dirty_bytes) was tested against this box's own incident dumps and
# either had no measurable relevance or was actively harmful. See the notes at the bottom.

# Reclaim floor. Default here was 45167 kB -- 44 MiB on a 121 GiB machine, i.e. 0.036%.
# The NVIDIA resman allocates with __GFP_RETRY_MAYFAIL, so when it hits that 44 MiB wall it
# spins in direct reclaim *while holding the RM rw-semaphore*, which blocks Xorg and
# nvidia-modeset behind it and is what makes the display die. A 2 GiB floor keeps ordinary
# GFP_KERNEL and GFP_ATOMIC (network RX, NVMe completion) allocations off that battleground.
vm.min_free_kbytes = 2097152

# Wake kswapd far earlier so reclaim happens ahead of the wall instead of every allocator
# entering direct reclaim at it. Default 10 gives a ~124 MiB band; 200 widens it materially.
vm.watermark_scale_factor = 200

# Restore SysRq process-signalling (bit 64), which was off: 176 = 128|32|16.
# 240 = 128|64|32|16 -- enables Alt+SysRq+F (OOM-kill the biggest task) and the
# remote-usable `echo f > /proc/sysrq-trigger`. Costs nothing until used.
kernel.sysrq = 240

# Deliberately NOT set, and why:
#   vm.swappiness           - left at 60. At the freeze, anon was a rounding error and swap
#                             was still free; lowering it only shrinks reclaimable memory.
#   vm.watermark_boost_factor=0 - the incident dump on the current kernel reads boost:0kB,
#                             so disabling it is an availability risk taken for no measured gain.
#   vm.overcommit_memory=2  - CUDA/JAX reserve address space with MAP_NORESERVE/PROT_NONE,
#                             so strict mode would fire ENOMEM unpredictably. Trap; avoid.
#   /sys/kernel/mm/lru_gen/min_ttl_ms - makes the kernel OOM *more often*, and this box's
#                             OOM victim selection is the broken part. Fix aim before rate.
